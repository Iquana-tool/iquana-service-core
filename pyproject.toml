[project]
name = "iquana-service-core"
version = "0.1.0"
description = "Shared FastAPI runtime for IQUANA AI segmentation services (app factory, health, model registry routes, session lifecycle)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "iquana-toolbox",
]

[tool.uv.sources]
# Pin to the SAME canonical toolbox revision every service uses.
# Bump this in lockstep with the services when the contract changes.
iquana-toolbox = { git = "https://github.com/Iquana-tool/iquana-toolbox.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iquana_service_core"]
